name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
      version_name:
        description: 'App Version Name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'App Version Code (e.g. 1)'
        required: true
        default: '1'
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Android NDK & SDK
        uses: android-actions/setup-android@v3

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          else
            echo "KEYSTORE_BASE64 secret is not provided. Skipping keystore decode."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          VERSION_NAME="${{ inputs.version_name || '1.0.0' }}"
          VERSION_CODE="${{ inputs.version_code || '1' }}"
          ./gradlew app:assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK Artifact Name
        run: |
          VERSION_NAME="${{ inputs.version_name || '1.0.0' }}"
          mkdir -p release_apk
          cp app/build/outputs/apk/release/app-release.apk "release_apk/Awedio-v${VERSION_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Awedio-Release-APK
          path: release_apk/*.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name || github.ref_name }}
          name: Release v${{ inputs.version_name || github.ref_name }}
          draft: false
          prerelease: false
          files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
